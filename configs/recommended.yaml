seed: 42
deterministic: true
data_dir: data/processed
run_dir: runs/recommended

model:
  tcn_channels: [64, 64, 96]
  kernel_size: 3
  gru_hidden: 64
  relation_hidden: 32
  bidirectional: true
  attention_heads: 4
  fusion_hidden: 128
  dropout: 0.25

training:
  batch_size: 256
  epochs: 50
  learning_rate: 0.001
  minimum_lr: 0.000001
  weight_decay: 0.0001
  focal_gamma: 1.5
  label_smoothing: 0.02
  class_weighting: true
  balanced_sampling: false
  auxiliary_weight: 0.20
  max_gradient_norm: 1.0
  early_stopping_patience: 10
  lr_patience: 3
  lr_factor: 0.5
  num_workers: 2
  amp: true

threshold:
  maximum_false_positive_rate: 0.05

